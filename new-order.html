<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Order - Sahid SMM Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7ff;
padding:20px;
}

.header{
background:#2563eb;
color:#fff;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.form{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:600;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
background:#2563eb;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1747b8;
}
</style>
</head>

<body>

<div class="header">
New Order
</div>

<div class="form">

<label>Service</label>

<select>
<option>Instagram Followers</option>
<option>Instagram Likes</option>
<option>YouTube Subscribers</option>
<option>Facebook Followers</option>
<option>TikTok Views</option>
</select>

<label>Link</label>

<input type="url" placeholder="https://">

<label>Quantity</label>

<input type="number" placeholder="1000">

<button>Place Order</button>

</div>

</body>
</html>
