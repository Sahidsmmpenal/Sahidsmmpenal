<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - Shahid SMM Panel</title>
    <style>
        body {
            background-color: #0d0b21;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #171336;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #28245c;
        }
        .nav-brand {
            color: #ff4757;
            font-weight: bold;
            font-size: 16px;
        }
        .menu-icon {
            font-size: 22px;
            cursor: pointer;
            color: #fff;
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            right: 0;
            background-color: #171336;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            border-left: 1px solid #28245c;
        }
        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            font-size: 15px;
            color: #b2bec3;
            display: block;
            transition: 0.3s;
            border-bottom: 1px solid rgba(40, 36, 92, 0.4);
        }
        .sidebar a:hover {
            color: #ffd700;
            background-color: #0d0b21;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 25px;
            border: none;
            background: none;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
        }
        .fund-box {
            background: #171336;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #28245c;
            text-align: center;
        }
        .page-title {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #28245c;
            padding-bottom: 10px;
            text-align: left;
        }
        .payment-info {
            background: #0d0b21;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #28245c;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ccc;
            text-align: left;
        }
        .payment-info span {
            color: #ffd700;
            font-weight: bold;
        }
        .qr-container {
            margin: 15px 0;
            background: #fff;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #a0a0a0;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0d0b21;
            border: 1px solid #28245c;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            background: #28245c;
            color: #fff;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #36307a;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">👑 CHEAPEST SMMPANELS</div>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">&times;</a>
        <a href="dashboard.html">🛒 New Order</a>
        <a href="orders.html">📦 Orders</a>
        <a href="services.html">📋 Services</a>
        <a href="add-funds.html" style="color: #ffd700;">💳 Add Funds</a>
        <a href="mass-order.html">⚡ Mass Order</a>
        <a href="referrals.html">🎁 Refer & Earn</a>
        <a href="updates.html">🔔 Updates</a>
        <a href="account.html">👤 Account</a>
        <a href="#" onclick="logout()" style="color: #ff4757; font-weight: bold;">🚪 Logout</a>
    </div>

    <div class="container">
        <div class="fund-box">
            <div class="page-title">💳 Add Funds via Dynamic QR</div>
            
            <div class="payment-info">
                <p>⚠️ নিচের বক্সে অ্যামাউন্ট লিখলে অটোমেটিক কিউআর কোড জেনারেট হয়ে যাবে। পেমেন্ট করার পর ট্রানজ্যাকশন আইডি সাবমিট করুন।</p>
                <p>UPI ID: <span>9749401427@fam</span></p>
            </div>

            <!-- ডাইনামিক কিউআর কোড ডিসপ্লে করার জায়গা -->
            <div class="qr-container">
                <img id="dynamic-qr" src="" alt="Scan & Pay QR">
            </div>

            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="fund-amount" placeholder="Enter amount" oninput="updateQRCode()">
            </div>

            <div class="form-group">
                <label>Transaction ID / UPI Ref No</label>
                <input type="text" id="trx-id" placeholder="Enter 12-digit Transaction ID">
            </div>

            <button class="btn-submit" onclick="submitFundRequest()">I Have Paid / Submit Payment</button>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            sidebar.style.width = sidebar.style.width === "250px" ? "0" : "250px";
        }

        // অ্যামাউন্ট পরিবর্তনের সাথে সাথে কিউআর কোড আপডেট করার ফাংশন
        function updateQRCode() {
            const amount = document.getElementById("fund-amount").value;
            const upiId = "9749401427@fam";
            const name = "ShahidSMM";
            
            let upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
            
            if (!amount || amount <= 0) {
                upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&cu=INR`;
            }

            // ফ্রি QR Code API ব্যবহার করে ডায়নামিক কিউআর জেনারেট করা হচ্ছে
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiString)}`;
            document.getElementById("dynamic-qr").src = qrApiUrl;
        }

        // পেজ লোড হওয়ার সাথে সাথে ডিফল্ট কিউআর দেখানোর জন্য
        window.onload = function() {
            updateQRCode();
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        window.submitFundRequest = async function() {
            const amount = document.getElementById("fund-amount").value;
            const trxId = document.getElementById("trx-id").value;

            if (!amount || !trxId) {
                alert("Please fill in the amount and Transaction ID!");
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                alert("Please login first!");
                return;
            }

            try {
                await addDoc(collection(db, "funds"), {
                    userId: user.uid,
                    userEmail: user.email,
                    amount: amount,
                    trxId: trxId,
                    gateway: "Dynamic UPI QR",
                    status: "Pending",
                    timestamp: serverTimestamp()
                });

                const botToken = "7703347975:AAhNvJsQZ7V6TM1V2D5oip025mTSaTfUA";
                const chatId = "8549960820";
                const message = `💳 New Fund Request (Dynamic QR)!\n\n👤 User: ${user.email}\n💰 Amount: ₹${amount}\n🆔 Trx ID: ${trxId}\n📱 UPI: 9749401427@fam`;
                const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

                fetch(telegramUrl).catch(err => console.log(err));

                alert("Fund request submitted successfully! Your balance will be added soon after verification.");
                document.getElementById("fund-amount").value = "";
                document.getElementById("trx-id").value = "";
                updateQRCode();

            } catch (error) {
                console.error("Error submitting fund request: ", error);
                alert("Failed to submit request. Try again!");
            }
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
