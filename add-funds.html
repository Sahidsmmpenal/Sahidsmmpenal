<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - Shahid SMM Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .fund-container {
            max-width: 500px;
            margin: 40px auto;
            background: #171336;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .form-row {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-row label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-row input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #28245c;
            background: #0d0b21;
            color: white;
            box-sizing: border-box;
        }
        .qr-box {
            margin-top: 20px;
            background: #0d0b21;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
        }
        .qr-box img {
            width: 180px;
            height: 180px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="fund-container">
        <h2>Add Funds to Wallet</h2>
        <p style="color: #a0a0a0; font-size: 14px;">Pay instantly and top up your account balance</p>
        
        <div class="form-row">
            <label>Amount (₹)</label>
            <input type="number" id="fund-amount" placeholder="Enter amount">
        </div>

        <button class="btn" onclick="showQRCode()">Generate QR / Pay</button>

        <!-- কিউআর কোড দেখানোর সেকশন -->
        <div id="qr-section" style="display: none;" class="qr-box">
            <p style="margin-top: 0; color: #ffd700;">Scan to Pay</p>
            <img src="31711.png" alt="Payment QR">
            <p style="font-size: 12px; color: #a0a0a0; margin-bottom: 0;">Scan this with any UPI App</p>
        </div>
    </div>

    <script>
        function showQRCode() {
            let amount = document.getElementById('fund-amount').value;
            if(amount && amount > 0) {
                document.getElementById('qr-section').style.display = 'block';
            } else {
                alert("Please enter a valid amount!");
            }
        }
    </script>
</body>
</html>
