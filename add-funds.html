<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - SAHID SMM PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; padding: 20px; }
        .container {
            max-width: 480px; margin: 30px auto; background: #1a1a1a;
            border: 1px solid #333; border-radius: 14px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 { text-align: center; color: #f39c12; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #bbb; font-size: 13px; font-weight: 600; }
        input {
            width: 100%; padding: 12px; background: #2b2b2b; color: #fff;
            border: 1px solid #444; border-radius: 8px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #f39c12; }
        
        .qr-section {
            display: none; text-align: center; background: #222;
            padding: 20px; border-radius: 10px; border: 1px dashed #f39c12; margin-top: 20px;
        }
        #qrcode { display: inline-block; padding: 10px; background: #fff; border-radius: 8px; margin-bottom: 10px; }
        .upi-info { font-size: 13px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
        
        .submit-btn {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #000; font-weight: bold; font-size: 15px; border: none; border-radius: 8px;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }

        /* পেন্ডিং লোডিং পপআপ স্টাইল */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-box {
            background: #1a1a1a; border: 1px solid #444; padding: 30px; border-radius: 14px;
            width: 85%; max-width: 340px; text-align: center; color: #fff;
        }
        .spinner {
            border: 4px solid #333; border-top: 4px solid #f39c12; border-radius: 50%;
            width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #f39c12; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👑 SAHID SMM PANEL</h2>
        <p class="subtitle">PhonePe / UPI Instant Fund Deposit</p>

        <div class="form-group">
            <label>Enter Amount (₹):</label>
            <input type="number" id="amountInput" placeholder="e.g., 100" min="1">
        </div>
        <button type="button" class="submit-btn" onclick="generateQRCode()">Generate PhonePe QR Code</button>

        <div class="qr-section" id="qrSection">
            <p style="font-size: 13px; color: #ddd; margin-bottom: 10px;">Scan & Pay via PhonePe / GPay / Paytm</p>
            <div id="qrcode"></div>
            <div class="upi-info">UPI ID: <span id="displayUpi">sahid@paytm</span></div>
            <p style="font-size: 12px; color: #aaa; margin-top: 5px;">Amount to pay: ₹<span id="payAmountText">0</span></p>

            <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">

            <div class="form-group" style="text-align: left;">
                <label>Enter UPI ID 12 digit (UTR / Transaction ID):</label>
                <input type="text" id="utrInput" placeholder="Enter 12-digit UTR ID" maxlength="12">
            </div>
            <button type="button" class="submit-btn" onclick="submitVerification()">I Have Paid (Verify)</button>
        </div>

        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <div class="modal-overlay" id="loadingModal">
        <div class="modal-box">
            <div class="spinner" id="modalSpinner"></div>
            <h3 id="modalTitle" style="color: #f39c12; margin-bottom: 8px;">Verification Pending</h3>
            <p id="modalDesc" style="font-size: 13px; color: #ccc;">Please wait while Admin checks your UTR ID...</p>
            <button id="modalCloseBtn" style="display: none; margin-top: 15px; padding: 8px 20px; background: #f39c12; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const myUpiID = "sahid@paytm"; // তোর আসল ইউপিআই আইডি এখানে বসিয়ে দিবি

        function generateQRCode() {
            const amt = document.getElementById('amountInput').value;
            if(!amt || amt <= 0) {
                alert('Please enter a valid amount first!');
                return;
            }

            document.getElementById('payAmountText').innerText = amt;
            document.getElementById('qrSection').style.display = 'block';
            
            // কিউআর কোডের ভেতরে ইউপিআই পেমেন্ট লিংক এনকোড করা (PhonePe ও অন্যান্য অ্যাপ সরাসরি পেমেন্ট ধরে নেবে)
            const upiString = `upi://pay?pa=${myUpiID}&pn=SahidSMM&am=${amt}&cu=INR`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: upiString,
                width: 150,
                height: 150
            });
        }

        function submitVerification() {
            const utr = document.getElementById('utrInput').value.trim();
            if(utr.length < 12) {
                alert('Please enter a valid 12-digit UPI / UTR transaction ID!');
                return;
            }

            // পেন্ডিং পপআপ ওপেন করা
            const modal = document.getElementById('loadingModal');
            document.getElementById('modalSpinner').style.display = 'block';
            document.getElementById('modalTitle').innerText = "Verification Pending";
            document.getElementById('modalTitle').style.color = "#f39c12";
            document.getElementById('modalDesc').innerText = "Please wait... Your payment is being verified by Admin.";
            document.getElementById('modalCloseBtn').style.display = 'none';
            modal.style.display = 'flex';

            // ডেমো হিসেবে টেলিগ্রাম বট বা ব্যাকএন্ডে রিকোয়েস্ট পাঠানোর পর 
            // অ্যাডমিন যখন টেলিগ্রাম থেকে এপ্রুভ বা ডিক্লাইন করবে, সেই সিম্যুলেশন এখানে দেখানো হলো:
            // (টেলিগ্রাম বটের কোডের সাথে লাইভ কানেক্ট করার জন্য তুই এখানে ফেচ বা ওয়েবহুক ইউজ করতে পারবি)
            
            setTimeout(() => {
                // উদাহরণস্বরূপ: অ্যাডমিন এপ্রুভ করলে নিচের কোড রান হবে (তোর টেলিগ্রাম বট থেকে কন্ট্রোল হবে)
                // simulateAdminApproval(true); 
            }, 5000);
        }

        // অ্যাডমিন এপ্রুভ বা ডিসলাইন করলে এই ফাংশনগুলো কাজ করবে
        function showApprovalResult(isApproved, message) {
            document.getElementById('modalSpinner').style.display = 'none';
            const titleEl = document.getElementById('modalTitle');
            const descEl = document.getElementById('modalDesc');
            
            if(isApproved) {
                titleEl.innerText = "Success! 🎉";
                titleEl.style.color = "#2ecc71";
                descEl.innerText = message || "Your payment is approved successfully! Balance added.";
            } else {
                titleEl.innerText = "Declined ❌";
                titleEl.style.color = "#e74c3c";
                descEl.innerText = message || "Your payment is declined by Admin.";
            }
            document.getElementById('modalCloseBtn').style.display = 'inline-block';
        }

        function closeModal() {
            document.getElementById('loadingModal').style.display = 'none';
            location.reload();
        }
    </script>
</body>
</html>
