<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Shahid SMM Panel</title>
    <style>
        body { background-color: #0d0b21; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { background: #171336; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28245c; }
        .nav-brand { color: #ff4757; font-weight: bold; font-size: 16px; }
        .menu-icon { font-size: 22px; cursor: pointer; color: #fff; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #171336; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-left: 1px solid #28245c; }
        .sidebar a { padding: 12px 25px; text-decoration: none; font-size: 15px; color: #b2bec3; display: block; transition: 0.3s; border-bottom: 1px solid rgba(40, 36, 92, 0.4); }
        .sidebar a:hover { color: #ffd700; background-color: #0d0b21; }
        .sidebar .close-btn { position: absolute; top: 10px; right: 20px; font-size: 25px; border: none; background: none; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .page-title { color: #fff; font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #28245c; padding-bottom: 10px; }
        .card { background: #171336; padding: 20px; border-radius: 12px; border: 1px solid #28245c; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group input { width: 100%; padding: 12px; background: #0d0b21; border: 1px solid #28245c; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-submit { background: #28245c; color: #fff; width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">👑 CHEAPEST SMMPANELS</div>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">&times;</a>
        <a href="dashboard.html">🛒 New Order</a>
        <a href="orders.html">📦 Orders</a>
        <a href="services.html">📋 Services</a>
        <a href="add-funds.html">💳 Add Funds</a>
        <a href="mass-order.html">⚡ Mass Order</a>
        <a href="referrals.html">🎁 Refer & Earn</a>
        <a href="updates.html">🔔 Updates</a>
        <a href="account.html" style="color: #ffd700;">👤 Account</a>
        <a href="#" onclick="logout()" style="color: #ff4757; font-weight: bold;">🚪 Logout</a>
    </div>
    <div class="container">
        <div class="page-title">👤 Account Settings</div>
        <div class="card">
            <div class="form-group">
                <label style="display:block; color:#a0a0a0; font-size:12px; margin-bottom:5px; font-weight:bold;">Email / Username</label>
                <input type="text" id="user-email" value="Loading..." disabled style="color: #ffd700; font-weight: bold;">
            </div>
            <div class="form-group">
                <label style="display:block; color:#a0a0a0; font-size:12px; margin-bottom:5px; font-weight:bold;">New Password</label>
                <input type="password" placeholder="Enter new password">
            </div>
            <button class="btn-submit" onclick="alert('Password update feature coming soon!')">Save Changes</button>
        </div>
    </div>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            sidebar.style.width = sidebar.style.width === "250px" ? "0" : "250px";
        }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("user-email").value = user.email || user.displayName || "User";
            } else {
                window.location.href = "index.html";
            }
        });

        window.logout = function() {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        }
    </script>
</body>
</html>
