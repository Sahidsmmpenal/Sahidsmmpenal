<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Add Fund - SAHID SMM PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="smm-dark-body">

    <div class="smm-container">
        <div class="payment-card" id="formCard">
            <h3>Add Funds via UPI QR</h3>
            <form id="paymentForm">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" required min="1">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>
                <button type="submit" class="pay-btn">Proceed to Pay</button>
            </form>
        </div>

        <div class="payment-card" id="qrCard" style="display: none; text-align: center;">
            <h3>Scan QR to Pay</h3>
            <p>Amount to Pay: <strong id="showAmount" style="color: #28a745; font-size: 18px;">₹0</strong></p>
            
            <div id="qrcode" style="display: inline-block; padding: 15px; background: #fff; border-radius: 10px; margin: 15px 0;"></div>
            
            <p class="instruction-note">Please scan with any UPI app (GPay, PhonePe, Paytm). Payment will be verified automatically!</p>
            
            <div class="spinner-border text-primary" role="status">
                <span class="loading-text">Waiting for payment confirmation... (<span id="countdown">300</span>s)</span>
            </div>
            
            <button type="button" class="pay-btn" id="cancelBtn" style="background: #dc3545; margin-top: 15px;">Cancel</button>
        </div>
    </div>

    <script src="auto-pay.js"></script>
</body>
</html>
