<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid SMM Panel - Add Funds</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .back-btn {
            background-color: #007bff;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
        .main-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 15px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .card h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
        }
        .form-row {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.3);
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #218838;
        }
        /* QR & Payment Section Styling */
        #payment-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 20px;
        }
        .qr-box {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .qr-box img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .status-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }
        .alert-pending {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sahid SMM Panel</h1>
        <div>
            <a href="dashboard.html" class="back-btn">Dashboard</a>
        </div>
    </div>

    <div class="main-container">
        <div class="card">
            <h2>Add Funds Securely</h2>
            
            <div id="step-amount">
                <div class="form-row">
                    <label>Enter Amount (₹)</label>
                    <input type="number" id="fund-amount" placeholder="e.g. 500">
                </div>
                <button class="btn" onclick="generateQR()">Proceed to Pay</button>
            </div>

            <div id="payment-section">
                <p style="color: #666; font-size: 13px; margin-bottom: 10px;">Scan this QR using any UPI App (GPay, PhonePe, Paytm)</p>
                <div class="qr-box">
                    <img id="dynamic-qr" src="" alt="UPI QR Code">
                </div>
                <p style="font-weight: bold; color: #333; font-size: 15px;" id="display-amt-text"></p>

                <div class="form-row" style="text-align: left; margin-top: 15px;">
                    <label>Enter 12-Digit UTR ID</label>
                    <input type="text" id="fund-utr" placeholder="Enter 12-digit UTR reference number" maxlength="12">
                </div>

                <button class="btn" style="background-color: #007bff;" onclick="submitPayment()">I Have Paid</button>
            </div>

            <div id="status-box" class="status-msg"></div>
        </div>
    </div>

    <script>
        // তোর দেওয়া ইউপিআই আইডি এখানে সেট করা আছে
        const myUpiId = "sahid.smm@ybl"; // তোর অরিজিনাল ইউপিআই আইডি এখানে বসিয়ে দিবি যদি বদলাতে চাস
        const backendApiUrl = 'https://sahid-telegram-bot-3khx.onrender.com/api/fund-request';

        function generateQR() {
            const amount = document.getElementById('fund-amount').value;
            if(!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            // ডায়নামিক ইউপিআই লিংক (UPI Intent URL)
            const upiUrl = `upi://pay?pa=${myUpiId}&pn=SahidSMM&am=${amount}&cu=INR`;
            
            // গুগল ফ্রি API দিয়ে ডায়নামিক কিউআর কোড জেনারেট করা হচ্ছে
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
            
            document.getElementById('dynamic-qr').src = qrApi;
            document.getElementById('display-amt-text').innerText = `Amount to Pay: ₹${amount}`;
            
            // অ্যামাউন্ট ফিল্ড হাইড করে পেমেন্ট সেクション ওপেন করা
            document.getElementById('step-amount').style.display = 'none';
            document.getElementById('payment-section').style.display = 'block';
        }

        async function submitPayment() {
            const amount = document.getElementById('fund-amount').value;
            const utr = document.getElementById('fund-utr').value;
            const userEmail = 'sm8237715320226@gmail.com'; // ইউজারের ইমেল বা আইডি

            if(!utr || utr.length < 12) {
                alert('Please enter a valid 12-digit UTR ID!');
                return;
            }

            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.className = 'status-msg alert-pending';
            statusBox.innerText = 'Please wait, your verification is pending. Please wait for admin reply.';

            try {
                const response = await fetch(backendApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        utr: utr,
                        userEmail: userEmail
                    })
                });

                const result = await response.json();
                if(result.success) {
                    // সফলভাবে রিকোয়েস্ট টেলিগ্রাম বটে চলে গেছে
                    console.log('Fund request sent to Telegram bot successfully.');
                } else {
                    alert('Network response warning, but your request is noted.');
                }
            } catch (error) {
                console.error('Error:', error);
                // নেটওয়ার্ক এরর হলেও ইউজারের স্ক্রিনে পেন্ডিং মেসেজ থাকবে যাতে ইউজার বিভ্রান্ত না হয়
            }
        }
    </script>

</body>
</html>
