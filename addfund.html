<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid SMM Panel - Add Funds</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .top-bar {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
        }
        .back-btn {
            background: white;
            color: #007bff;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .container {
            max-width: 480px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .card h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #222;
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-pay {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-pay:hover {
            background-color: #218838;
        }
        #payment-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            border-top: 1px dashed #ddd;
            padding-top: 20px;
        }
        .qr-box {
            background: #fff;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .qr-box img {
            width: 170px;
            height: 170px;
            display: block;
        }
        .status-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            display: none;
            text-align: center;
        }
        .alert-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">🔥 Sahid SMM</div>
        <a href="dashboard.html" class="back-btn">Dashboard</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>Add Funds Securely</h2>
            
            <div id="step-amount">
                <div class="form-group">
                    <label>Enter Amount (₹)</label>
                    <input type="number" id="fund-amount" placeholder="e.g. 500">
                </div>
                <button class="btn-pay" onclick="generateQR()">Proceed to Pay</button>
            </div>

            <div id="payment-section">
                <p style="color: #666; font-size: 12px; margin-bottom: 10px;">Scan QR using any UPI App (GPay, PhonePe, Paytm)</p>
                <div class="qr-box">
                    <img id="dynamic-qr" src="" alt="QR Code">
                </div>
                <p style="font-weight: bold; color: #333; font-size: 14px;" id="display-amt-text"></p>

                <div class="form-group" style="text-align: left; margin-top: 15px;">
                    <label>Enter 12-Digit UTR ID</label>
                    <input type="text" id="fund-utr" placeholder="Enter 12-digit UTR reference number" maxlength="12">
                </div>

                <button class="btn-pay" style="background-color: #007bff;" onclick="submitPayment()">I Have Paid</button>
            </div>

            <div id="status-box" class="status-msg"></div>
        </div>
    </div>

    <script>
        const myUpiId = "sahid.smm@ybl"; 
        const backendApiUrl = 'https://sahid-telegram-bot-3khx.onrender.com/api';
        let checkInterval = null;

        function generateQR() {
            const amount = document.getElementById('fund-amount').value;
            if(!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            const upiUrl = `upi://pay?pa=${myUpiId}&pn=SahidSMM&am=${amount}&cu=INR`;
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(upiUrl)}`;
            
            document.getElementById('dynamic-qr').src = qrApi;
            document.getElementById('display-amt-text').innerText = `Amount to Pay: ₹${amount}`;
            
            document.getElementById('step-amount').style.display = 'none';
            document.getElementById('payment-section').style.display = 'block';
        }

        async function submitPayment() {
            const amount = document.getElementById('fund-amount').value;
            const utr = document.getElementById('fund-utr').value;
            const userEmail = localStorage.getItem('user_email') || 'sm8237715320226@gmail.com';

            if(!utr || utr.length < 12) {
                alert('Please enter a valid 12-digit UTR ID!');
                return;
            }

            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.className = 'status-msg alert-pending';
            statusBox.innerText = '⏳ Please wait, your verification is pending. Waiting for admin reply...';

            try {
                await fetch(`${backendApiUrl}/fund-request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, utr, userEmail })
                });

                if(checkInterval) clearInterval(checkInterval);
                checkInterval = setInterval(() => {
                    checkPaymentStatus(utr);
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function checkPaymentStatus(utr) {
            try {
                const response = await fetch(`${backendApiUrl}/check-status?utr=${utr}`);
                const data = await response.json();
                const statusBox = document.getElementById('status-box');

                if (data.status === 'approved') {
                    clearInterval(checkInterval);
                    statusBox.className = 'status-msg alert-success';
                    statusBox.innerHTML = '🎉 Your balance added successfully!';
                } else if (data.status === 'declined') {
                    clearInterval(checkInterval);
                    statusBox.className = 'status-msg alert-danger';
                    statusBox.innerHTML = '❌ Payment Declined by Admin. Please check UTR and try again.';
                }
            } catch (err) {
                console.error('Status check error:', err);
            }
        }
    </script>
</body>
</html>
