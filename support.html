<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - SAHID SMM PANEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="smm-dark-body">
    <div class="smm-container">
        <h2>Support Tickets</h2>
        <div class="payment-card">
            <form id="ticketForm">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" placeholder="Issue regarding payment/order" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" placeholder="Describe your issue..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc;" required></textarea>
                </div>
                <button type="submit" class="pay-btn">Submit Ticket</button>
            </form>
        </div>
    </div>
</body>
</html>
