<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shahid SMM Panel</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23171336%22 stroke=%22%23ffd700%22 stroke-width=%225%22/><text x=%2250%%22 y=%2260%%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%23ffd700%22 text-anchor=%22middle%22>S</text></svg>">
    <style>
        body { background-color: #0d0b21; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { background: #171336; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28245c; }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-box { width: 38px; height: 38px; background: linear-gradient(135deg, #171336, #28245c); border: 2px solid #ffd700; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .logo-box svg { width: 22px; height: 22px; fill: #ffd700; }
        .brand-title { color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; }
        .brand-title span { color: #ff4757; }
        .menu-icon { font-size: 22px; cursor: pointer; color: #fff; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #171336; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-left: 1px solid #28245c; }
        .sidebar a { padding: 12px 25px; text-decoration: none; font-size: 15px; color: #b2bec3; display: block; transition: 0.3s; border-bottom: 1px solid rgba(40, 36, 92, 0.4); }
        .sidebar a:hover { color: #ffd700; background-color: #0d0b21; }
        .sidebar .close-btn { position: absolute; top: 10px; right: 20px; font-size: 25px; border: none; background: none; }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; }
        .welcome-card { background: #171336; padding: 20px; border-radius: 12px; border: 1px solid #28245c; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { color: #ffd700; font-size: 18px; font-weight: bold; }
        .order-box { background: #171336; padding: 20px; border-radius: 12px; border: 1px solid #28245c; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #a0a0a0; font-size: 13px; margin-bottom: 5px; font-weight: bold; }
        .form-group select, .form-group input { width: 100%; padding: 12px; background: #0d0b21; border: 1px solid #28245c; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
        .btn-submit { background: #6c5ce7; color: #fff; width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background: #5b4bc4; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5M19 19C19 19.6 18.6 20 18 20H6C5.4 20 5 19.6 5 19V18H19V19Z"/></svg>
            </div>
            <div class="brand-title">SHAHID <span>SMM</span></div>
        </a>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">&times;</a>
        <a href="dashboard.html" style="color: #ffd700;">🛒 New Order</a>
        <a href="orders.html">📦 Orders</a>
        <a href="services.html">📋 Services</a>
        <a href="add-funds.html">💳 Add Funds</a>
        <a href="admin.html" style="color: #38ef7d; font-weight: bold;">⚙️ Admin Panel</a>
        <a href="mass-order.html">⚡ Mass Order</a>
        <a href="referrals.html">🎁 Refer & Earn</a>
        <a href="updates.html">🔔 Updates</a>
        <a href="account.html">👤 Account</a>
        <a href="#" onclick="logout()" style="color: #ff4757; font-weight: bold;">🚪 Logout</a>
    </div>

    <div class="container">
        <div class="welcome-card">
            <div>
                <h3 style="margin: 0; color: #fff; font-size: 16px;">Welcome Back!</h3>
                <span id="user-email-display" style="color: #a0a0a0; font-size: 12px;">Loading...</span>
            </div>
            <div class="balance-box">
                Balance: ₹<span id="user-balance">0.00</span>
            </div>
        </div>

        <div class="order-box">
            <h3 style="color: #ffd700; margin-top: 0; font-size: 18px; margin-bottom: 15px;">Create New Order</h3>
            
            <div class="form-group">
                <label>Service Category</label>
                <select id="category" onchange="updateServices()">
                    <option value="">Select Category</option>
                    <option value="instagram">Instagram Services</option>
                    <option value="youtube">YouTube Services</option>
                    <option value="telegram">Telegram Services</option>
                    <option value="facebook">Facebook Services</option>
                    <option value="tiktok">TikTok Services</option>
                </select>
            </div>

            <div class="form-group">
                <label>Service</label>
                <select id="service">
                    <option value="">Select Category First</option>
                </select>
            </div>

            <div class="form-group">
                <label>Link</label>
                <input type="text" id="order-link" placeholder="Enter target profile/video link...">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="order-quantity" placeholder="1000" min="10">
            </div>

            <button class="btn-submit" id="place-order-btn">Place Order</button>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            sidebar.style.width = sidebar.style.width === "250px" ? "0" : "250px";
        }

        function updateServices() {
            const category = document.getElementById("category").value;
            const serviceSelect = document.getElementById("service");
            serviceSelect.innerHTML = '<option value="">Select Service</option>';

            let services = [];
            if (category === "instagram") {
                services = [
                    { id: "101", name: "101 - Instagram Followers [Max 50K] [Fast] - ₹120 per 1000" },
                    { id: "102", name: "102 - Instagram Real Followers [Non-Drop] - ₹250 per 1000" },
                    { id: "103", name: "103 - Instagram Likes [Instant] - ₹20 per 1000" },
                    { id: "104", name: "104 - Instagram Reel Views [Super Fast] - ₹10 per 1000" }
                ];
            } else if (category === "youtube") {
                services = [
                    { id: "201", name: "201 - YouTube Views [High Retention] - ₹350 per 1000" },
                    { id: "202", name: "202 - YouTube Subscribers [Non-Drop] - ₹850 per 1000" },
                    { id: "203", name: "203 - YouTube Likes [Real Accounts] - ₹150 per 1000" }
                ];
            } else if (category === "telegram") {
                services = [
                    { id: "301", name: "301 - Telegram Channel Members [Non-Drop] - ₹180 per 1000" },
                    { id: "302", name: "302 - Telegram Post Views [Auto] - ₹15 per 1000" }
                ];
            } else if (category === "facebook") {
                services = [
                    { id: "401", name: "401 - Facebook Page Likes & Followers - ₹300 per 1000" },
                    { id: "402", name: "402 - Facebook Video Views - ₹50 per 1000" }
                ];
            } else if (category === "tiktok") {
                services = [
                    { id: "501", name: "501 - TikTok Followers [Fast] - ₹200 per 1000" },
                    { id: "502", name: "502 - TikTok Views - ₹10 per 1000" }
                ];
            }

            services.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.id;
                opt.textContent = s.name;
                serviceSelect.appendChild(opt);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("user-email-display").innerText = user.email;
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        document.getElementById("user-balance").innerText = userSnap.data().balance || "0.00";
                    } else {
                        document.getElementById("user-balance").innerText = "0.00";
                    }
                } catch (e) {
                    document.getElementById("user-balance").innerText = "0.00";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
