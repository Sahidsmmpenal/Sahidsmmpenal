<!DOCTYPE html>
<html lang="bn">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --accent-color: #5a67d4;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 30px 15px;
            color: var(--text-color);
            min-height: 100vh;
        }
        .order-container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .panel-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .panel-header h2 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }
        .panel-header p {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #4a5568;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        label i {
            color: var(--accent-color);
            margin-right: 8px;
        }
        .custom-select-box, input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            background-color: #f8fafc;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            color: #2d3748;
        }
        .custom-select-box:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(90, 103, 212, 0.15);
        }
        .info-box {
            background: #ebf8ff;
            border-left: 5px solid #3182ce;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-size: 13.5px;
            color: #2b6cb0;
            line-height: 1.6;
        }
        .submit-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.6);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
