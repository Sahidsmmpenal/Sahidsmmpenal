<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shahid SMM Panel</title>
    <style>
        body {
            background-color: #0d0b21;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Navbar */
        .navbar {
            background: #171336;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #28245c;
        }
        .nav-brand {
            color: #ff4757;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            color: #fff;
        }
        .dashboard-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
        }
        .banner-text {
            background: #171336;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid #28245c;
        }
        .card {
            background: #171336;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #28245c;
        }
        .card h3 {
            margin: 0;
            color: #a0a0a0;
            font-size: 13px;
        }
        .card p {
            margin: 8px 0 0 0;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }
        .card a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .card a:hover {
            text-decoration: underline;
        }
        /* Order Form Styles */
        .order-box {
            background: #171336;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #28245c;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #a0a0a0;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0d0b21;
            border: 1px solid #28245c;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            background: #28245c;
            color: #fff;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #36307a;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">👑 CHEAPEST SMMPANELS</div>
        <div class="menu-icon" onclick="logout()">☰</div>
    </div>

    <div class="dashboard-container">
        <div class="banner-text">
            👉 OUR BELIEVE - QUALITY OVER QUANTITY 👈
        </div>

        <div class="card">
            <h3>👤 Username / Email</h3>
            <p id="user-display" style="font-size: 16px; color: #ffd700;">Loading...</p>
        </div>

        <div class="card">
            <h3>📊 Spent Balance</h3>
            <p>₹0</p>
        </div>

        <div class="card">
            <h3>💳 Add Funds</h3>
            <p>₹0 <span style="font-size: 13px; float: right;"><a href="add-funds.html">CLICK HERE</a></span></p>
        </div>

        <div class="order-box">
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #28245c; padding-bottom: 8px;">Place New Order</h3>
            
            <div class="form-group">
                <label>Category</label>
                <select id="category" onchange="updateServices()">
                    <option value="">Select Category</option>
                    <option value="followers_guaranteed">Instagram Followers [Guaranteed]</option>
                    <option value="followers_autorefill">Instagram Followers [Auto Refill]</option>
                    <option value="followers_indian">Instagram Followers [Indian]</option>
                    <option value="likes_indian">Instagram Likes [Indian]</option>
                    <option value="likes_nondrop">Instagram Likes [NON DROP]</option>
                    <option value="likes_real">Instagram Likes 💯 Real & Active Accounts</option>
                    <option value="likes_usa">Instagram USA Services</option>
                    <option value="likes_brazil">Instagram Brazil Services</option>
                    <option value="views">Instagram Views/Reel</option>
                </select>
            </div>

            <div class="form-group">
                <label>Service</label>
                <select id="service" onchange="updateRate()">
                    <option value="">Select Category First</option>
                </select>
            </div>

            <div class="form-group">
                <label>Link</label>
                <input type="url" id="link" placeholder="https://instagram.com/p/example">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="1000" onkeyup="calculateTotal()">
            </div>

            <div class="form-group">
                <label>Charge (₹)</label>
                <input type="text" id="total" value="0.00" disabled style="background: #120f2b; color: #ffd700; font-weight: bold;">
            </div>

            <button class="btn-submit" onclick="placeOrder()">Submit</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Show user's email or display name just like the video username card
                document.getElementById("user-display").innerText = user.email || user.displayName || "sm8237715";
            } else {
                // If not logged in, redirect to login page
                window.location.href = "index.html";
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        }
    </script>

    <script>
        let currentRate = 0;

        function updateServices() {
            const category = document.getElementById("category").value;
            const serviceSelect = document.getElementById("service");
            serviceSelect.innerHTML = "";

            if(category === "followers_guaranteed") {
                serviceSelect.innerHTML = `
                    <option value="158.30">4257 - Instagram Followers [Refill - 20Days] [Speed 50K+/Day] [HQ] [Instant] - ₹158.30 per 1000</option>
                    <option value="96.03">4181 - Instagram Followers [Lifetime Non Drop] [Speed 100K+/Day] [WW] [365Days] - ₹96.03 per 1000</option>
                    <option value="123.42">4180 - Instagram Followers [Speed - 200k+/Day] [Refill - 90Days] [Good Quality] - ₹123.42 per 1000</option>
                    <option value="129.20">4761 - Instagram Followers [Refill - 365Days] [Speed -30K-50K Day] - ₹129.20 per 1000</option>
                `;
            } else if(category === "followers_autorefill") {
                serviceSelect.innerHTML = `
                    <option value="107.86">6219 - Instagram Followers [Real Mixed] [Speed 100K+/Day] [No Drop] [Auto Refill + Button 7D] - ₹107.86 per 1000</option>
                    <option value="115.22">6220 - Instagram Followers [Real Mixed] [Speed 100K+/Day] [No Drop] [Auto Refill + Button 30D] - ₹115.22 per 1000</option>
                    <option value="125.02">6221 - Instagram Followers [Real Mixed] [Speed 100K+/Day] [No Drop] [Auto Refill + Button 365D] - ₹125.02 per 1000</option>
                `;
            } else if(category === "followers_indian") {
                serviceSelect.innerHTML = `
                    <option value="201.32">760 - Instagram Followers(Indian) [Speed - 100K /Day / Refill:-30days / Recommend for High Speed Followers / (Start:-0-1hr)] - ₹201.32 per 1000</option>
                    <option value="233.01">4075 - Instagram Indian Real Mix [Speed - 50K/Day] [30 Days] [Instant] - ₹233.01 per 1000</option>
                    <option value="173.26">759 - Instagram Followers(Indian)- Speed:-100K /Day / Refill:-30days / Recommend for High Speed Followers / (Start:-0-1hr)] - ₹173.26 per 1000</option>
                `;
            } else if(category === "likes_indian") {
                serviceSelect.innerHTML = `
                    <option value="24.43">1476 - Instagram Likes [PURE INDIAN] [Accounts With Stories] [FAST AND REAL] [10k-50k Speed Day] - ₹24.43 per 1000</option>
                    <option value="58.26">3203 - Instagram Likes [INDIA MIX] [Start Time: Instant] [Speed: 50K/Day] - ₹58.26 per 1000</option>
                    <option value="85.92">1424 - Instagram Likes [INDIAN MIX] [Refill: 365Days] [Max: 100K] [Start Time: 0-1Hours] [Speed: 50K/Day] - ₹85.92 per 1000</option>
                `;
            } else if(category === "likes_nondrop") {
                serviceSelect.innerHTML = `
                    <option value="3.36">1418 - Instagram Like [Speed 100k/day] [Start:Instant] [High Quality] - ₹3.36 per 1000</option>
                    <option value="3.79">4690 - Instagram Likes [Speed 10K/H] [Non Drop] [Start:Instant] - ₹3.79 per 1000</option>
                    <option value="4.19">1232 - Instagram Likes - [Max - 100K | Speed:10K/Hour ] [Non Drop ] [Medium Quality] - ₹4.19 per 1000</option>
                `;
            } else if(category === "likes_real") {
                serviceSelect.innerHTML = `
                    <option value="11.39">700 - Instagram Power Likes [Perfect Quality] [Speed 30K/Day] [High Followers Count] - ₹11.39 per 1000</option>
                    <option value="28.96">698 - Instagram Power Likes [Real HQ with Stories] [Speed:- 20/Hour] [Ultrafast] - ₹28.96 per 1000</option>
                    <option value="206.93">701 - Instagram Power Likes [Speed 10K/Hour] [Start 0-10 Minute] [Ultrafast] - ₹206.93 per 1000</option>
                `;
            } else if(category === "likes_usa") {
                serviceSelect.innerHTML = `
                    <option value="377.34">6165 - Instagram USA 🇺🇸 Followers 🔥 | 30-Day Refill | Max 100K | Instant Start - ₹377.34 per 1000</option>
                    <option value="67.39">6166 - Instagram USA 🇺🇸 Real and Active Likes | Max 100K | Instant Start | Non-Drop - ₹67.39 per 1000</option>
                `;
            } else if(category === "likes_brazil") {
                serviceSelect.innerHTML = `
                    <option value="36.25">6170 - 🇧🇷 Instagram Like Brazil [Max 1K] - ₹36.25 per 1000</option>
                    <option value="46.99">6171 - 🇧🇷 Instagram Like Brazil [Max 5K] - ₹46.99 per 1000</option>
                    <option value="73.84">6172 - 🇧🇷 Instagram Like Brazil [Max 200K] [Lifetime Refill] - ₹73.84 per 1000</option>
                `;
            } else if(category === "views") {
                serviceSelect.innerHTML = `
                    <option value="0.21">1348 - 👁️‍🗨️ INSTAGRAM VIEWS [CHEAPEST] [NO SUPPORT] - ₹0.21 per 1000</option>
                    <option value="0.25">146 - 👁️‍🗨️ INSTAGRAM VIEWS [NATURAL SPEED] - ₹0.25 per 1000</option>
                    <option value="0.78">1370 - 👁️‍🗨️ INSTAGRAM VIEWS [AVERAGE SPEED] - ₹0.78 per 1000</option>
                `;
            } else {
                serviceSelect.innerHTML = `<option value="">Select Category First</option>`;
            }
            updateRate();
        }

        function updateRate() {
            const serviceSelect = document.getElementById("service");
            currentRate = parseFloat(serviceSelect.value) || 0;
            calculateTotal();
        }

        function calculateTotal() {
            const qty = document.getElementById("quantity").value;
            let total = qty ? ((qty / 1000) * currentRate).toFixed(2) : "0.00";
            document.getElementById("total").value = "₹ " + total;
        }

        function placeOrder() {
            const link = document.getElementById("link").value;
            const qty = document.getElementById("quantity").value;
            if(!link || !qty) {
                alert("Please fill in all details!");
                return;
            }
            alert("Order placed successfully!");
            window.location.href = "orders.html";
        }
    </script>
</body>
</html>
