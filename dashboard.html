<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid SMM Panel - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .user-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sahid SMM Panel - Add Funds</h2>
        
        <div class="user-info">
            <p>Logged in User: <span id="user-email-display" style="font-weight: bold; color: #333;">sm8237715320226@gmail.com</span></p>
        </div>

        <div class="form-group">
            <label for="fund-amount">Amount (₹):</label>
            <input type="number" id="fund-amount" placeholder="Enter amount">
        </div>

        <div class="form-group">
            <label for="fund-utr">12-Digit UTR ID:</label>
            <input type="text" id="fund-utr" placeholder="Enter 12-digit UTR transaction ID" maxlength="12">
        </div>

        <button onclick="submitFundRequest()">Submit Payment Request</button>
    </div>

    <script>
        async function submitFundRequest() {
            const amt = document.getElementById('fund-amount').value;
            const utr = document.getElementById('fund-utr').value;
            const userEmail = document.getElementById('user-email-display').innerText;

            if(!amt || !utr) {
                alert('Please enter both Amount and UTR ID!');
                return;
            }

            if(utr.length < 12) {
                alert('Please enter a valid 12-digit UTR ID!');
                return;
            }

            try {
                // তোর রেন্ডার ব্যাকএন্ড সার্ভারের লাইভ ইউআরএল এখানে বসানো আছে
                const backendApiUrl = 'https://sahid-telegram-bot-3khx.onrender.com/api/fund-request';

                const response = await fetch(backendApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amt,
                        utr: utr,
                        userEmail: userEmail
                    })
                });

                const result = await response.json();
                if(result.success) {
                    alert('Fund request submitted successfully! Admin will verify your UTR ID (' + utr + ') and approve funds.');
                    document.getElementById('fund-amount').value = '';
                    document.getElementById('fund-utr').value = '';
                } else {
                    alert('Failed to send request. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error! Make sure your backend server is live.');
            }
        }
    </script>

</body>
</html>
