<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid SMM Panel - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
        }
        .main-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-top: 0;
            color: #333;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        /* Modal Style for Add Funds */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .close-btn {
            background-color: #dc3545;
            margin-top: 10px;
        }
        .close-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sahid SMM Panel</h1>
        <div>
            <span id="user-email-display" style="margin-right: 15px;">sm8237715320226@gmail.com</span>
            <button class="btn" onclick="openAddFundsModal()">Add Funds</button>
        </div>
    </div>

    <div class="main-container">
        <div class="card">
            <h3>Welcome to your Dashboard!</h3>
            <p>Here you can manage your services, check order status, and add funds instantly to your account using our automated Telegram verification system.</p>
            <button class="btn" onclick="openAddFundsModal()">Deposit Money Now</button>
        </div>
    </div>

    <div id="addFundsModal" class="modal">
        <div class="modal-content">
            <h3>Add Funds via UTR</h3>
            <div class="form-group">
                <label for="fund-amount">Amount (₹):</label>
                <input type="number" id="fund-amount" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label for="fund-utr">12-Digit UTR ID:</label>
                <input type="text" id="fund-utr" placeholder="Enter 12-digit UTR transaction ID" maxlength="12">
            </div>
            <button class="btn" onclick="submitFundRequest()" style="width: 100%;">Submit Payment Request</button>
            <button class="btn close-btn" onclick="closeAddFundsModal()" style="width: 100%;">Cancel</button>
        </div>
    </div>

    <script>
        function openAddFundsModal() {
            document.getElementById('addFundsModal').style.display = 'flex';
        }

        function closeAddFundsModal() {
            document.getElementById('addFundsModal').style.display = 'none';
        }

        async function submitFundRequest() {
            const amt = document.getElementById('fund-amount').value;
            const utr = document.getElementById('fund-utr').value;
            const userEmail = document.getElementById('user-email-display').innerText;

            if(!amt || !utr) {
                alert('Please enter both Amount and UTR ID!');
                return;
            }

            if(utr.length < 12) {
                alert('Please enter a valid 12-digit UTR ID!');
                return;
            }

            try {
                const backendApiUrl = 'https://sahid-telegram-bot-3khx.onrender.com/api/fund-request';

                const response = await fetch(backendApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amt,
                        utr: utr,
                        userEmail: userEmail
                    })
                });

                const result = await response.json();
                if(result.success) {
                    alert('Fund request submitted successfully! Admin will verify your UTR ID (' + utr + ') and approve funds.');
                    closeAddFundsModal();
                    document.getElementById('fund-amount').value = '';
                    document.getElementById('fund-utr').value = '';
                } else {
                    alert('Failed to send request. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error! Make sure your backend server is live.');
            }
        }
    </script>

</body>
</html>
