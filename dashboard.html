<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shahid SMM Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 40px auto;
            background: #171336;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #28245c;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .balance-box {
            background: #0d0b21;
            padding: 10px 20px;
            border-radius: 6px;
            color: #ffd700;
            font-weight: bold;
        }
        .form-row {
            margin-bottom: 15px;
        }
        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-row select, .form-row input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #28245c;
            background: #0d0b21;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-section">
            <h2>Shahid SMM Panel</h2>
            <div class="balance-box">Balance: ₹0.00</div>
        </div>

        <h3>Create New Order</h3>
        
        <div class="form-row">
            <label>Category</label>
            <select id="category">
                <option>Instagram Followers (Cheap & Fast)</option>
                <option>Instagram Likes</option>
                <option>Instagram Views (₹0.20 / 1k)</option>
                <option>YouTube Subscribers & Views</option>
            </select>
        </div>

        <div class="form-row">
            <label>Service</label>
            <select id="service">
                <option>Non-Drop High Quality Followers - ₹45</option>
                <option>Instant Views - ₹0.20</option>
            </select>
        </div>

        <div class="form-row">
            <label>Link</label>
            <input type="text" placeholder="https://instagram.com/your-profile">
        </div>

        <div class="form-row">
            <label>Quantity</label>
            <input type="number" id="quantity" placeholder="1000">
        </div>

        <button class="btn" onclick="placeOrder()">New Order</button>
    </div>

    <script>
        function placeOrder() {
            alert("Order placed successfully! (Backend integration pending)");
        }
    </script>
</body>
</html>
