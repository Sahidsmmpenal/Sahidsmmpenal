<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SAHID SMM PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0d1b2a, #1b263b); min-height: 100vh; display: flex; justify-content: center; align-items: center;">

    <div style="width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box;">
        <div style="background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%); padding: 35px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative;">
            
            <h2 style="text-align: center; color: #1e293b; margin-top: 0; margin-bottom: 25px; font-size: 26px; font-weight: 700;">Create Account</h2>

            <button type="button" onclick="handleGoogleLogin()" style="width: 100%; background: #ffffff; color: #334155; border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;">
                <i class="fa-brands fa-google" style="color: #ea4335; font-size: 18px;"></i> Sign up with Google
            </button>

            <form id="signupForm">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">First Name</label>
                    <input type="text" id="firstName" placeholder="" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; box-sizing: border-box; font-size: 14px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">Last Name</label>
                    <input type="text" id="lastName" placeholder="" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; box-sizing: border-box; font-size: 14px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="signupPassword" placeholder="" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; box-sizing: border-box; font-size: 14px;">
                </div>

                <div style="margin-bottom: 22px;">
                    <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; box-sizing: border-box; font-size: 14px;">
                </div>

                <button type="submit" style="width: 100%; background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 114, 255,.3);">Create Account</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; margin-bottom: 0;">
                Already have an account? <a href="index.html" style="color: #0072ff; text-decoration: none; font-weight: 700;">Login</a>
            </p>

        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
