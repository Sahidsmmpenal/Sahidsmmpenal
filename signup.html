<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Shahid SMM Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0284c7; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: #fff; color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 25px; color: #0284c7; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #cbd5e1; color: #000; border-radius: 6px; font-size: 15px; }
        input:focus { outline: none; border-color: #0284c7; background: #fff; }
        
        .btn-signup { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; margin-bottom: 15px; }
        .btn-signup:hover { background: #0369a1; }

        /* Google Sign-Up Button Style */
        .btn-google { width: 100%; padding: 12px; background: #fff; color: #334155; border: 1px solid #cbd5e1; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.3s; margin-bottom: 15px; }
        .btn-google:hover { background: #f1f5f9; }

        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #475569; }
        .login-link a { color: #0284c7; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        
        .social-links { margin-top: 25px; text-align: center; display: flex; justify-content: space-around; font-size: 14px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
        .social-links a { color: #0284c7; text-decoration: none; font-weight: 600; }
        .social-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Account</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password (min 6 chars)" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn-signup">Sign Up</button>
        </form>

        <button type="button" class="btn-google" onclick="signupWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.53 0 9s.35 2.85.95 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.01 2.33c.71-2.13 2.7-3.71 5.04-3.71z"/></svg>
            Sign up with Google
        </button>

        <div class="login-link">
            Already have an account? <a href="index.html">Login here</a>
        </div>

        <div class="social-links">
            <a href="https://t.me/sahidsmmpenal" target="_blank">Telegram</a>
            <a href="https://whatsapp.com/channel/0029VbDL4QSGZNClqroqCO0H" target="_blank">WhatsApp Channel</a>
            <a href="https://wa.me/9749401427" target="_blank">WhatsApp Support</a>
        </div>
    </div>

    <script>
        // Firebase Configuration Setup
        const firebaseConfig = {
          apiKey: "AIzaSyBELsMTiY8OqZE5zJqwUThrfUCSu13gG7U",
          authDomain: "sahidsmmpenal.firebaseapp.com",
          databaseURL: "https://sahidsmmpenal-default-rtdb.firebaseio.com",
          projectId: "sahidsmmpenal",
          storageBucket: "sahidsmmpenal.firebasestorage.app",
          messagingSenderId: "278872394021",
          appId: "1:278872394021:web:0309da42a62c36195472cc",
          measurementId: "G-B17NWVEBP3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Email / Password Registration Handler
        function handleSignup(event) {
            event.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                alert("❌ Password must be at least 6 characters long!");
                return;
            }

            if (password !== confirmPassword) {
                alert("❌ Passwords do not match!");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("✅ Account created successfully on Shahid SMM Panel!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("❌ Signup Error: " + error.message);
                });
        }

        // Google Sign-Up Authentication Handler using Firebase
        function signupWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    alert("✅ Successfully registered with Google as " + user.displayName);
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("❌ Google Signup Error: " + error.message);
                });
        }
    </script>
</body>
</html>
