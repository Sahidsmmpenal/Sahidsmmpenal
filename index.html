<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHID SMM PANEL</title>
    <!-- Tailwind CSS CDN for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-card {
            background: linear-gradient(135deg, #1e1b36 0%, #131022 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto relative min-h-screen pb-20">

    <!-- Header Section / Website Name -->
    <div class="text-center mb-6">
        <h1 class="text-xl font-bold text-purple-400 mb-1">শাহিদ এসএমএম প্যানেল</h1>
        <div class="inline-block">
            <span class="text-xs bg-amber-100 text-amber-900 py-1 px-3 rounded-full font-semibold shadow-md">

            </span>
        </div>
    </div>

    <!-- User & Balance Info Cards -->

            <div class="flex items-center space-x-3">
                <div class="bg-slate-800 p-3 rounded-xl text-xl font-bold">শ</div>
                <div>

            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="custom-card p-4 rounded-2xl shadow-lg">
                <div class="text-slate-400 text-xl mb-1"><i class="fa-solid fa-chart-pie"></i></div>
                <div class="text-xl font-bold">৳0</div>
                <div class="text-xs text-slate-400">Spent balance</div>
            </div>
            <div class="custom-card p-4 rounded-2xl shadow-lg">
                <div class="text-slate-400 text-xl mb-1"><i class="fa-solid fa-wallet"></i></div>
                <div class="text-xl font-bold">৳0</div>
                <div class="text-xs text-slate-400">To add more Fund <a href="#" class="text-blue-400 underline">CLICK HERE</a></div>
            </div>
        </div>
    </div>

    <!-- Social Media Icon Grid Menu -->
    <div class="custom-card p-4 rounded-2xl mb-6 shadow-xl">
        <div class="grid grid-cols-6 gap-3 text-center">
            <a href="#" class="bg-slate-800/80 p-3 rounded-xl hover:bg-slate-700 transition flex items-center justify-center text-lg"><i class="fa-solid fa-bars"></i></a>
            <a href="#" class="bg-blue-500/20 text-blue-400 p-3 rounded-xl hover:bg-blue-500/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-telegram"></i></a>
            <a href="#" class="bg-green-500/20 text-green-400 p-3 rounded-xl hover:bg-green-500/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-spotify"></i></a>
            <a href="#" class="bg-purple-500/20 text-purple-400 p-3 rounded-xl hover:bg-purple-500/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="bg-slate-700/50 text-white p-3 rounded-xl hover:bg-slate-600 transition flex items-center justify-center text-lg font-bold">𝕏</a>
            <a href="#" class="bg-blue-600/20 text-blue-500 p-3 rounded-xl hover:bg-blue-600/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-facebook"></i></a>
            
            <a href="#" class="bg-black text-white p-3 rounded-xl hover:bg-slate-900 transition flex items-center justify-center text-lg"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" class="bg-red-500/20 text-red-500 p-3 rounded-xl hover:bg-red-500/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" class="bg-yellow-500/20 text-yellow-400 p-3 rounded-xl hover:bg-yellow-500/30 transition flex items-center justify-center text-lg"><i class="fa-brands fa-snapchat"></i></a>

            <a href="#" class="bg-orange-500/20 text-orange-400 p-3 rounded-xl hover:bg-orange-500/30 transition flex items-center justify-center text-lg"><i class="fa-solid fa-star"></i></a>

        </div>
        
        <!-- Search Bar -->
        <div class="mt-4 relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" placeholder="Search" class="w-full bg-[#131022] text-white pl-10 pr-4 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-purple-500 text-sm">
        </div>
    </div>

    <!-- Order Form Section -->
    <div class="custom-card p-4 rounded-2xl space-y-4 shadow-xl">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Category</label>
            <select class="w-full bg-[#131022] text-white p-3 rounded-xl border border-slate-700 focus:outline-none text-sm">
                <option>📷 Instagram Followers [Guaranteed]</option>
                <option>💬 Instagram Likes</option>
                <option>📺 Instagram Views</option>
            </select>
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">Service</label>
            <select class="w-full bg-[#131022] text-white p-3 rounded-xl border border-slate-700 focus:outline-none text-sm">
                <option>4257 - Instagram Followers [Refill - 20Da...</option>
            </select>
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">Link</label>
            <input type="text" placeholder="https://..." class="w-full bg-[#131022] text-white p-3 rounded-xl border border-slate-700 focus:outline-none text-sm">
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">Quantity</label>
            <input type="number" placeholder="1000" class="w-full bg-[#131022] text-white p-3 rounded-xl border border-slate-700 focus:outline-none text-sm">
            <p class="text-[11px] text-slate-400 mt-1">Min: 100 - Max: 1 000 000</p>
        </div>

        <button class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl hover:opacity-95 transition shadow-lg">
            Submit
        </button>
    </div>

    <!-- Floating WhatsApp Support Button (এখানে নাম্বার পরিবর্তন করতে পারবেন) -->
    <a href="https://wa.me/@maybe._.sahid" target="_blank" class="fixed bottom-6 right-6 bg-green-500 text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-xl hover:bg-green-600 transition z-50">
        <i class="fa-brands fa-whatsapp"></i>

</html>
