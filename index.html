<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahid SMM Panel - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Shahid SMM Panel</h1>
        <p class="subtitle">The Cheapest & Best SMM Panel</p>
        
        <div class="input-group">
            <label>Username or Email</label>
            <input type="text" placeholder="Enter your username">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
        </div>
        
        <button class="btn" onclick="loginUser()">Sign In</button>
        <button class="btn btn-google" onclick="handleGoogleSignIn()">Sign in with Google</button>
    </div>

    <script>
        function loginUser()  
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
