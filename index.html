<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shahid SMM Panel</title>
    <meta name="google-site-verification" content="B1GOGLO0r4d5ousp" />
    <meta name="description" content="Shahid SMM Panel - Best and cheapest SMM panel for social media services.">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: #171336;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: #0d0b21;
            border: 1px solid #28245c;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-custom {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        .btn-primary-custom {
            background: #6c5ce7;
            color: #fff;
        }
        .btn-primary-custom:hover {
            background: #5b4bc4;
        }
        .btn-google {
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn-google:hover {
            background: #f1f1f1;
        }
        .divider {
            margin: 20px 0;
            color: #666;
            font-size: 13px;
            position: relative;
        }
        .toggle-link {
            color: #ffd700;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px;
            display: inline-block;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 id="form-title" style="color: #fff;">Login to Shahid SMM</h2>
        <p style="color: #a0a0a0; font-size: 13px; margin-bottom: 20px;">Manage your SMM services easily</p>
        
        <!-- Email & Password Form -->
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button id="submit-btn" class="btn-custom btn-primary-custom">Login</button>
        
        <span class="toggle-link" id="toggle-mode">Don't have an account? Sign Up</span>

        <div class="divider">OR</div>

        <!-- Google Sign-in Button -->
        <button id="google-btn" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"></path><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.9-3.04.9-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"></path><path fill="#FBBC05" d="M3.96 10.75c-.18-.54-.28-1.12-.28-1.75s.1-1.21.28-1.75V4.92H.95C.34 6.13 0 7.52 0 9s.34 2.87.95 4.08l3.01-2.33z"></path><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.92l3.01 2.33c.71-2.13 2.7-3.71 5.04-3.71z"></path></svg>
            Continue with Google
        </button>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence Error: ", error);
        });

        let isSignUp = false;

        document.getElementById("toggle-mode").addEventListener("click", () => {
            isSignUp = !isSignUp;
            document.getElementById("form-title").innerText = isSignUp ? "Create Account" : "Login to Shahid SMM";
            document.getElementById("submit-btn").innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById("toggle-mode").innerText = isSignUp ? "Already have an account? Login" : "Don't have an account? Sign Up";
        });

        document.getElementById("submit-btn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if(!email || !password) {
                alert("Please fill in both email and password!");
                return;
            }

            if(isSignUp) {
                createUserWithEmailAndPassword(auth, email, password)
                .then((result) => {
                    alert("Account created successfully!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("Sign Up Failed: " + error.message);
                });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                .then((result) => {
                    alert("Login Successful!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("Login Failed: " + error.message);
                });
            }
        });

        document.getElementById("google-btn").addEventListener("click", () => {
            signInWithPopup(auth, provider)
            .then((result) => {
                alert("Google Login Successful!");
                window.location.href = "dashboard.html";
            }).catch((error) => {
                alert("Google Login Failed: " + error.message);
            });
        });
    </script>
</body>
</html>
