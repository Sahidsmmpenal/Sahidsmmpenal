<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shahid SMM Panel</title>
    <style>
        body { background-color: #0d0b21; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { max-width: 400px; width: 100%; padding: 30px; background: #171336; border-radius: 12px; border: 1px solid #28245c; box-sizing: border-box; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: #a0a0a0; font-size: 13px; margin-bottom: 8px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; background: #0d0b21; border: 1px solid #28245c; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
        .btn-submit { background: #6c5ce7; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-submit:hover { background: #5b4bc4; }
        .btn-google { background: #ffffff; color: #000000; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f1f1; }
        .error-msg { color: #ff4757; font-size: 13px; margin-bottom: 15px; display: none; }
        .link-text { margin-top: 15px; font-size: 13px; color: #a0a0a0; }
        .link-text a { color: #ffd700; text-decoration: none; }
        .divider { margin: 15px 0; color: #a0a0a0; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h3 style="color: #ffd700; margin-top: 0; margin-bottom: 20px;">🔐 Login to SMM Panel</h3>
        
        <div id="errorMsg" class="error-msg"></div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>

        <button class="btn-submit" id="loginBtn">Login</button>
        
        <div class="divider">OR</div>

        <!-- Google Sign-in Button -->
        <button class="btn-google" id="googleLoginBtn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            Sign in with Google
        </button>

        <div class="link-text">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore();

        // পার্সিস্টেন্স সেটআপ (ট্যাব কাটলেও লগআউট হবে না)
        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Auth persistence error: ", error);
        });

        // ইমেল-পাসওয়ার্ড লগইন
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('errorMsg');

            if (!email || !password) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Please fill in all fields!";
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Invalid email or password!";
            }
        });

        // গুগল সাইন-ইন লজিক (সাথে ফায়ারস্টোরে ইউজার চেক ও ব্যালেন্স তৈরি)
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            const errorDiv = document.getElementById('errorMsg');

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // চেক করা ইউজার ডাটাবেসে আগে থেকেই আছে কি না, না থাকলে তৈরি করা
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        balance: 0.00,
                        createdAt: new Date()
                    });
                }

                window.location.href = "dashboard.html";
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = error.message;
            }
        });
    </script>
</body>
</html>
