<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahid SMM Panel - Best SMM Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #cbd5e1; }
        select, input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 16px; }
        select:focus, input:focus { outline: none; border-color: #38bdf8; }
        .total-price { font-size: 18px; font-weight: bold; color: #4ade80; margin: 15px 0; text-align: right; }
        button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0369a1; }
        .social-links { margin-top: 20px; text-align: center; display: flex; justify-content: space-around; }
        .social-links a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .social-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shahid SMM Panel</h2>
        <form id="orderForm" onsubmit="return validateAndSubmit(event)">
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" onchange="updateServices()">
                    <option value="">Select Category</option>
                    <option value="instagram">Instagram Followers [Real]</option>
                    <option value="telegraming">Telegram Members [Non-Drop]</option>
                    <option value="whatsapp">WhatsApp Channel Members</option>
                </select>
            </div>

            <div class="form-group">
                <label for="service">Service</label>
                <select id="service" onchange="updatePrice()">
                    <option value="">Select Service First</option>
                </select>
            </div>

            <div class="form-group">
                <label for="link">Target Link</label>
                <input type="url" id="link" placeholder="https://example.com/your-target" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" placeholder="Enter quantity" min="10" max="100000" oninput="updatePrice()" required>
            </div>

            <div class="total-price" id="totalPriceDisplay">Total Price: $0.00</div>

            <button type="submit">Place Order</button>
        </form>

        <div class="social-links">
            <a href="https://t.me/sahidsmmpenal" target="_blank">Telegram</a>
            <a href="https://whatsapp.com/channel/0029VbDL4QSGZNClqroqCO0H" target="_blank">WhatsApp Channel</a>
            <a href="https://wa.me/9749401427" target="_blank">WhatsApp Support</a>
        </div>
    </div>

    <script>
        // Realtime Service List Data
        const servicesData = {
            instagram: [
                { id: 101, name: "Instagram Followers - Super Fast", pricePer1000: 1.50 },
                { id: 102, name: "Instagram Likes - High Quality", pricePer1000: 0.80 }
            ],
            telegraming: [
                { id: 201, name: "Telegram Members - Lifetime Warranty", pricePer1000: 2.20 },
                { id: 202, name: "Telegram Post Views", pricePer1000: 0.10 }
            ],
            whatsapp: [
                { id: 301, name: "WhatsApp Channel Followers", pricePer1000: 3.00 }
            ]
        };

        function updateServices() {
            const categorySelect = document.getElementById("category").value;
            const serviceSelect = document.getElementById("service");
            
            serviceSelect.innerHTML = '<option value="">Select Service</option>';
            
            if (categorySelect && servicesData[categorySelect]) {
                servicesData[categorySelect].forEach(service => {
                    let opt = document.createElement("option");
                    opt.value = service.pricePer1000;
                    opt.textContent = service.name + " - $" + service.pricePer1000 + " per 1000";
                    serviceSelect.appendChild(opt);
                });
            }
            updatePrice();
        }

        function updatePrice() {
            const serviceSelect = document.getElementById("service");
            const quantityInput = document.getElementById("quantity").value;
            const pricePer1000 = parseFloat(serviceSelect.value) || 0;
            const qty = parseInt(quantityInput) || 0;

            const total = (pricePer1000 / 1000) * qty;
            document.getElementById("totalPriceDisplay").innerText = "Total Price: $" + total.toFixed(2);
        }

        function validateAndSubmit(event) {
            event.preventDefault();
            
            const category = document.getElementById("category").value;
            const service = document.getElementById("service").value;
            const link = document.getElementById("link").value;
            const quantity = parseInt(document.getElementById("quantity").value);

            if (!category || !service) {
                alert("❌ Please select a valid Category and Service!");
                return false;
            }

            if (!link || !link.startsWith("http")) {
                alert("❌ Please enter a valid URL starting with http/https!");
                return false;
            }

            if (isNaN(quantity) || quantity <= 0) {
                alert("❌ Please enter a valid quantity amount!");
                return false;
            }

            if (quantity < 10) {
                alert("❌ Minimum order quantity is 10!");
                return false;
            }

            // Success validation
            alert("✅ Order Placed Successfully on Shahid SMM Panel!");
            document.getElementById("orderForm").reset();
            document.getElementById("totalPriceDisplay").innerText = "Total Price: $0.00";
            return true;
        }
    </script>
</body>
</html>
