<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahid SMM Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#00e5ff;
}

.menu{
    font-size:30px;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:40px;
    color:#00e5ff;
}

.hero p{
    margin-top:15px;
    color:#ccc;
    font-size:18px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    background:#00e5ff;
    color:black;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.card{
    width:90%;
    max-width:400px;
    margin:30px auto;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.card h2{
    color:#00e5ff;
}

.card p{
    margin-top:10px;
}
</style>

</head>

<body>

<header>
<div class="logo">Sahid SMM Panel</div>
<div class="menu">☰</div>
</header>

<section class="hero">
<h1>Welcome</h1>
<p>India's Fastest SMM Panel</p>

<a href="#" class="btn">Get Started</a>
</section>

</body>
</html>
