<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Order - SAHID SMM PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="smm-dark-body">
    <div class="smm-container">
        <div class="payment-card">
            <h2>Mass Order</h2>
            <p style="font-size: 12px; color: #666;">One order per line (service_id | link | quantity)</p>
            <form id="massOrderForm">
                <textarea rows="8" placeholder="531 | https://instagram.com/p/xxx | 1000" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;"></textarea>
                <button type="submit" class="pay-btn" style="margin-top:10px;">Submit Mass Order</button>
            </form>
        </div>
    </div>
</body>
</html>
