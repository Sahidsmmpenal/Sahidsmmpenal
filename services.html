<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services - Sahid SMM Panel</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
background:#f5f7ff;
font-family:'Poppins',sans-serif;
}

.header{
background:#2563eb;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.service-card{
background:white;
margin:15px;
padding:18px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.service-card h3{
color:#2563eb;
margin-bottom:10px;
}

.info{
display:flex;
justify-content:space-between;
margin-top:8px;
font-size:15px;
}

.order-btn{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

.order-btn:hover{
background:#1747b8;
}

</style>

</head>

<body>

<div class="header">
<i class="fa-solid fa-list"></i>
Services
</div>

<div class="search">
<input type="text" placeholder="Search Services...">
</div>

<div class="service-card">

<h3>
<i class="fa-brands fa-instagram"></i>
Instagram Followers
</h3>

<div class="info">
<span>Price</span>
<span>₹120 / 1000</span>
</div>

<div class="info">
<span>Start Time</span>
<span>0-1 Hour</span>
</div>

<div class="info">
<span>Speed</span>
<span>Fast</span>
</div>

<button class="order-btn">
Order Now
</button>

</div>

<div class="service-card">

<h3>
<i class="fa-brands fa-youtube"></i>
YouTube Subscribers
</h3>

<div class="info">
<span>Price</span>
<span>₹250 / 1000</span>
</div>

<div class="info">
<span>Start Time</span>
<span>0-6 Hour</span>
</div>

<div class="info">
<span>Speed</span>
<span>Fast</span>
</div>

<button class="order-btn">
Order Now
</button>

</div>

<div class="service-card">

<h3>
<i class="fa-brands fa-facebook"></i>
Facebook Followers
</h3>

<div class="info">
<span>Price</span>
<span>₹150 / 1000</span>
</div>

<div class="info">
<span>Start Time</span>
<span>0-2 Hour</span>
</div>

<div class="info">
<span>Speed</span>
<span>Fast</span>
</div>

<button class="order-btn">
Order Now
</button>

</div>

</body>
</html>
