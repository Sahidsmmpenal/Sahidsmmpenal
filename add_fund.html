<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - Secure Payment</title>
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .payment-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }
        .payment-card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .generate-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .generate-btn:hover {
            opacity: 0.9;
        }
        
        /* Dynamic QR Container */
        .qr-container {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .qr-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .qr-box img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .instruction {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 12px;
            line-height: 1.5;
        }
        .live-status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        /* Spinner animation for live status */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #38bdf8;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <h2>অ্যাড ফান্ড (Add Funds)</h2>
        
        <!-- Step 1: Amount Input -->
        <div class="input-group">
            <label>টাকার পরিমাণ লিখুন (Amount)</label>
            <input type="number" id="amountInput" placeholder="যেমন: 500" min="1">
        </div>

        <button class="generate-btn" onclick="generateDynamicQR()">QR কোড তৈরি করুন</button>

        <!-- Step 2: Dynamic QR Display (Initially Hidden) -->
        <div id="qrContainer" class="qr-container">
            <div class="qr-box">
                <!-- এখানে তোর API বা ডায়নামিক সার্ভার থেকে অ্যামাউন্ট সহ QR ইমেজ জেনারেট হয়ে আসবে -->
                <img id="dynamicQRImage" src="" alt="Dynamic QR Code">
            </div>
            <p class="instruction">যেকোনো UPI অ্যাপ দিয়ে স্ক্যান করুন। পেমেন্ট সফল হওয়ার সাথে সাথে অটোমেটিক অ্যাকাউন্টেন্ট ব্যালেন্স যোগ হয়ে যাবে।</p>
            
            <div class="live-status">
                <div class="spinner"></div> পেমেন্টের জন্য অপেক্ষা করা হচ্ছে...
            </div>
        </div>
    </div>

    <script>
        function generateDynamicQR() {
            const amount = document.getElementById('amountInput').value;
            
            if(!amount || amount <= 0) {
                alert('দয়া করে সঠিক টাকার পরিমাণ লিখুন!');
                return;
            }

            // ডায়নামিক QR কোড জেনারেট করার লজিক (তোর পেমেন্ট গেটওয়ে API বা URL এখানে কাজ করবে)
            // উদাহরণস্বরূপ: একটি ডায়নামিক UPI লিঙ্ক বা API এন্ডপয়েন্ট যেখানে অ্যামাউন্ট পাস করা হয়
            // যেমন: https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@handle&am=
            
            let upiID = "9749401427@fam"; // তোর আসল UPI আইডি এখানে বসাবি
            let qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${upiID}&am=${amount}&cu=INR`;

            // QR ইমেজ সেট করা
            document.getElementById('dynamicQRImage').src = qrApiUrl;

            // QR বক্স শো করা
            document.getElementById('qrContainer').style.display = 'block';

            // ব্যাকগ্রাউন্ডে পেমেন্ট স্ট্যাটাস চেক করার জন্য তোর API কল বা Webhook লজিক এখানে ফায়ার করতে পারিস
            startPaymentListener(amount);
        }

        function startPaymentListener(amount) {
            // এখানে তোর ব্যাকএন্ড পিএইচপি ফাইলের সাথে কানেক্ট করে লাইভ চেক করতে পারিস ইউজার টাকা পাঠিয়েছে কি না
            console.log("Listening for payment of amount: " + amount);
        }
    </script>

</body>
</html>
