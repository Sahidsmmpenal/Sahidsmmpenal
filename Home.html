<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden p-4 space-y-4">
        
        <!-- Header / Logo Area -->
        <div class="flex justify-between items-center border-b pb-3">
            <h1 class="text-lg font-bold text-blue-600">Sahid SMM Panel</h1>
            <div class="bg-gray-100 px-3 py-1 rounded text-xs font-semibold text-gray-700">Menu ☰</div>
        </div>

        <!-- Announcement / Notice -->
        <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded">
            5% Discount available for API users and resellers.
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button class="flex-1 bg-teal-500 text-white py-2 rounded text-sm font-semibold">Whatsapp Channel</button>
            <button class="flex-1 bg-cyan-500 text-white py-2 rounded text-sm font-semibold">Join Group ✨</button>
        </div>

        <button class="w-full bg-blue-500 text-white py-2 rounded text-sm font-semibold">Add Funds</button>

        <!-- User Info Card -->
        <div class="border rounded p-3 bg-gray-50 flex items-center gap-3">
            <span class="text-2xl">💳</span>
            <div>
                <p class="font-bold text-gray-700 text-sm">sahid_user786</p>
                <p class="text-xs text-gray-500">Welcome to Sahid SMM Panel!</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="border p-3 rounded bg-white shadow-sm">
                <p class="text-lg font-bold text-gray-800">৳ 0</p>
                <p class="text-[10px] text-gray-500">Account balance</p>
            </div>
            <div class="border p-3 rounded bg-white shadow-sm">
                <p class="text-lg font-bold text-gray-800">৳ 0</p>
                <p class="text-[10px] text-gray-500">Spent balance</p>
            </div>
            <div class="border p-3 rounded bg-white shadow-sm">
                <p class="text-lg font-bold text-gray-800">1232117</p>
                <p class="text-[10px] text-gray-500">Total Orders</p>
            </div>
        </div>

        <!-- Order Form Section -->
        <div class="space-y-3 pt-2">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
                <select class="w-full border rounded p-2 text-sm bg-white">
                    <option>Instagram Followers | One Click Drop</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Service</label>
                <select class="w-full border rounded p-2 text-sm bg-white">
                    <option>Instagram Followers | REAL ACC</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Link</label>
                <input type="text" class="w-full border rounded p-2 text-sm" placeholder="https://...">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Quantity</label>
                <input type="number" class="w-full border rounded p-2 text-sm" placeholder="Min: 50 - Max: 100000">
            </div>

            <button class="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold shadow">Submit</button>
        </div>

    </div>

</body>
</html>
