<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel - Users & Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .auth-card h3 {
            margin-bottom: 15px;
            color: #fff;
        }
        .auth-card input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            font-size: 15px;
        }
        .auth-card button {
            background: #6366f1;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: none;
        }
        h2 {
            font-size: 22px;
            margin: 25px 0 15px 0;
            color: #ffffff;
        }
        .section-title {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .table-responsive {
            overflow-x: auto;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-accept { background: #10b981; color: white; margin-right: 5px; }
        .btn-reject { background: #ef4444; color: white; }
        .status-pending { color: #f59e0b; font-weight: 500; }
        .status-approved { color: #10b981; font-weight: 500; }
        .status-rejected { color: #ef4444; font-weight: 500; }
        .no-data { text-align: center; padding: 25px; color: #94a3b8; }
        .back-btn {
            display: inline-block;
            margin-bottom: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h3>Admin Access</h3>
            <input type="password" id="adminPin" placeholder="Enter Security Code">
            <button id="verifyBtn">Login</button>
        </div>
    </div>

    <div class="container" id="adminContainer">
        <a href="dashboard.html" class="back-btn">← Back to Website</a>
        <h2 class="section-title">Admin Dashboard</h2>
        
        <h2>Payment Requests & Approvals</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>Amount</th>
                        <th>UTR Number</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="paymentTableBody">
                    <tr><td colspan="5" class="no-data">Loading payments...</td></tr>
                </tbody>
            </table>
        </div>

        <h2>Registered Users List</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>User UID</th>
                        <th>Email / Username</th>
                        <th>Current Balance</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="3" class="no-data">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const correctPin = "admin@sahid-123";

        document.getElementById('verifyBtn').addEventListener('click', () => {
            const enteredPin = document.getElementById('adminPin').value;
            if (enteredPin === correctPin) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadPendingPayments();
                loadRegisteredUsers();
            } else {
                alert("Incorrect Security Code!");
            }
        });

        // পেমেন্ট রিকোয়েস্ট লোড করার ফাংশন
        async function loadPendingPayments() {
            const tableBody = document.getElementById('paymentTableBody');
            try {
                const querySnapshot = await getDocs(collection(db, "funds"));
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="no-data">No payment requests found.</td></tr>`;
                    return;
                }

                let rowsHtml = "";
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const docId = documentSnap.id;

                    let actionButtons = '';
                    if (data.status === "Pending") {
                        actionButtons = `
                            <button class="btn btn-accept" onclick="handlePayment('${docId}', '${data.userId}', ${data.amount}, 'Approved')">Accept</button>
                            <button class="btn btn-reject" onclick="handlePayment('${docId}', '${data.userId}', ${data.amount}, 'Rejected')">Reject</button>
                        `;
                    } else {
                        actionButtons = `<span style="color: #94a3b8; font-size: 12px;">Processed</span>`;
                    }

                    let statusClass = "status-pending";
                    if (data.status === "Approved") statusClass = "status-approved";
                    if (data.status === "Rejected") statusClass = "status-rejected";

                    rowsHtml += `
                        <tr>
                            <td>${data.email || 'N/A'}</td>
                            <td>₹${data.amount}</td>
                            <td><b>${data.utrNumber}</b></td>
                            <td><span class="${statusClass}">${data.status}</span></td>
                            <td>${actionButtons}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = rowsHtml;

            } catch (error) {
                console.error("Error loading payments: ", error);
                tableBody.innerHTML = `<tr><td colspan="5" class="no-data">Failed to load payments. Check Console.</td></tr>`;
            }
        }

        // রেজিস্টার্ড ইউজারদের তালিকা লোড করার ফাংশন
        async function loadRegisteredUsers() {
            const usersTableBody = document.getElementById('usersTableBody');
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                
                if (querySnapshot.empty) {
                    usersTableBody.innerHTML = `<tr><td colspan="3" class="no-data">No registered users found.</td></tr>`;
                    return;
                }

                let usersHtml = "";
                querySnapshot.forEach((documentSnap) => {
                    const userData = documentSnap.data();
                    const userId = documentSnap.id;

                    usersHtml += `
                        <tr>
                            <td style="font-size: 12px; color: #94a3b8;">${userId}</td>
                            <td><b>${userData.email || userData.username || 'N/A'}</b></td>
                            <td>₹${userData.balance || 0}</td>
                        </tr>
                    `;
                });

                usersTableBody.innerHTML = usersHtml;

            } catch (error) {
                console.error("Error loading users: ", error);
                usersTableBody.innerHTML = `<tr><td colspan="3" class="no-data">Failed to load users.</td></tr>`;
            }
        }

        // এপ্রুভ বা রিজেক্ট করার ফাংশন
        window.handlePayment = async function(paymentDocId, userId, amount, action) {
            if (!confirm(`Are you sure you want to ${action} this payment?`)) return;

            try {
                const paymentRef = doc(db, "funds", paymentDocId);

                if (action === "Approved") {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, {
                        balance: increment(amount)
                    }).catch(err => console.log(err));

                    await updateDoc(paymentRef, { status: "Approved" });
                    alert("Payment Accepted & Balance Added!");
                } else {
                    await updateDoc(paymentRef, { status: "Rejected" });
                    alert("Payment Rejected!");
                }

                loadPendingPayments();
                loadRegisteredUsers();
            } catch (error) {
                console.error("Error: ", error);
                alert("Action failed.");
            }
        };
    </script>
</body>
</html>
