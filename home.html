<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sahid SMM Panel</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<header class="header">

<div class="topbar">

<h2 class="logo">SAHID SMM PANEL</h2>

<i class="fa-solid fa-bars menu"></i>

</div>

<div class="user-card">

<img id="userPhoto"
src="assets/default-avatar.png"
alt="User">

<div>

<h3 id="userName">Loading...</h3>

<p id="userEmail">Loading...</p>

</div>

</div>

<div class="balance-card">

<p class="balance-title">Available Balance</p>

<h1 id="balance" class="balance">৳0</h1>

<p class="spent">
Spent :
<span id="spent">৳0</span>
</p>

</div>

</header>

<div class="menu-grid">
  <div class="menu-box">
    <div class="menu-icon">
        <i class="fa-brands fa-instagram"></i>
    </div>
    <div class="menu-title">Instagram</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-brands fa-telegram"></i>
    </div>
    <div class="menu-title">Telegram</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-solid fa-cart-shopping"></i>
    </div>
    <div class="menu-title">New Order</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-solid fa-list"></i>
    </div>
    <div class="menu-title">Services</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-solid fa-box"></i>
    </div>
    <div class="menu-title">Orders</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-solid fa-wallet"></i>
    </div>
    <div class="menu-title">Add Fund</div>
</div>

<div class="menu-box">
    <div class="menu-icon">
        <i class="fa-solid fa-user"></i>
    </div>
    <div class="menu-title">Profile</div>
</div>

<div class="menu-box" id="logout">
    <div class="menu-icon">
        <i class="fa-solid fa-right-from-bracket"></i>
    </div>
    <div class="menu-title">Logout</div>
</div>

</div>

<nav class="bottom-nav">

<a href="#" class="active">
<i class="fa-solid fa-house"></i>
<span>Home</span>
</a>

<a href="#">
<i class="fa-solid fa-list"></i>
<span>Services</span>
</a>

<a href="#">
<i class="fa-solid fa-box"></i>
<span>Orders</span>
</a>

<a href="#">
<i class="fa-solid fa-user"></i>
<span>Profile</span>
</a>

</nav>

<script type="module" src="app.js"></script>

</body>
</html>
