<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7ff;
padding:20px;
}

.profile-card{
background:#2563eb;
color:#fff;
border-radius:20px;
padding:30px;
text-align:center;
}

.profile-card img{
width:100px;
height:100px;
border-radius:50%;
border:4px solid #fff;
margin-bottom:15px;
}

.profile-card h2{
font-size:24px;
}

.profile-card p{
margin-top:5px;
font-size:15px;
}

.info{
background:#fff;
margin-top:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
}

button{
width:100%;
margin-top:25px;
padding:15px;
background:#ef4444;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#dc2626;
}

</style>
</head>

<body>

<div class="profile-card">

<img src="https://i.imgur.com/8Km9tLL.png">

<h2>Sahid Molla</h2>

<p>sahid@example.com</p>

</div>

<div class="info">

<div class="row">
<span>Username</span>
<span>@sahidmolla90</span>
</div>

<div class="row">
<span>Balance</span>
<span>₹0.00</span>
</div>

<div class="row">
<span>Total Orders</span>
<span>0</span>
</div>

<div class="row">
<span>Status</span>
<span>Active</span>
</div>

<button>Logout</button>

</div>

</body>
</html>
