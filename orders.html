<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7ff;
padding:20px;
}

.header{
background:#2563eb;
color:#fff;
padding:18px;
border-radius:15px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.order-card{
background:#fff;
padding:18px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.order-id{
font-size:18px;
font-weight:700;
color:#2563eb;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.status{
margin-top:12px;
display:inline-block;
padding:8px 15px;
background:#22c55e;
color:#fff;
border-radius:30px;
font-size:14px;
font-weight:600;
}

</style>

</head>

<body>

<div class="header">
Order History
</div>

<div class="order-card">

<div class="order-id">
#100001
</div>

<div class="row">
<span>Service</span>
<span>Instagram Followers</span>
</div>

<div class="row">
<span>Quantity</span>
<span>1000</span>
</div>

<div class="row">
<span>Charge</span>
<span>₹120</span>
</div>

<div class="status">
Completed
</div>

</div>

<div class="order-card">

<div class="order-id">
#100002
</div>

<div class="row">
<span>Service</span>
<span>YouTube Subscribers</span>
</div>

<div class="row">
<span>Quantity</span>
<span>500</span>
</div>

<div class="row">
<span>Charge</span>
<span>₹125</span>
</div>

<div class="status" style="background:#f59e0b;">
Processing
</div>

</div>

</body>
</html>
