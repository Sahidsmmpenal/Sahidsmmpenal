<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Shahid SMM Panel</title>
    <style>
        body {
            background-color: #0d0b21;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Navbar */
        .navbar {
            background: #171336;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #28245c;
        }
        .nav-brand {
            color: #ff4757;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #ffd700;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .page-title {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #28245c;
            padding-bottom: 10px;
        }
        .card {
            background: #171336;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #28245c;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #28245c;
        }
        th {
            color: #a0a0a0;
            font-size: 12px;
            text-transform: uppercase;
        }
        td {
            color: #fff;
        }
        .status-pending {
            color: #ffa502;
            font-weight: bold;
        }
        .status-completed {
            color: #2ed573;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            background: #28245c;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #36307a;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">👑 CHEAPEST SMMPANELS</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="orders.html" class="active">Orders</a>
            <a href="add-funds.html">Add Funds</a>
        </div>
    </div>

    <div class="container">
        <div class="page-title">📦 Order History</div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Service / Link</th>
                        <th>Qty</th>
                        <th>Charge</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-list">
                    <tr>
                        <td>#1001</td>
                        <td>Instagram Followers<br><small style="color: #a0a0a0;">https://instagram.com/p/example</small></td>
                        <td>1000</td>
                        <td>₹120.00</td>
                        <td><span class="status-completed">Completed</span></td>
                    </tr>
                    <tr>
                        <td>#1002</td>
                        <td>Instagram Views<br><small style="color: #a0a0a0;">https://instagram.com/reel/example</small></td>
                        <td>5000</td>
                        <td>₹5.00</td>
                        <td><span class="status-pending">Pending</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    </div>

</body>
</html>
