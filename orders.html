<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Shahid SMM Panel</title>
    <style>
        body {
            background-color: #0d0b21;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #171336;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #28245c;
        }
        .nav-brand {
            color: #ff4757;
            font-weight: bold;
            font-size: 16px;
        }
        .menu-icon {
            font-size: 22px;
            cursor: pointer;
            color: #fff;
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            right: 0;
            background-color: #171336;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            border-left: 1px solid #28245c;
        }
        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            font-size: 15px;
            color: #b2bec3;
            display: block;
            transition: 0.3s;
            border-bottom: 1px solid rgba(40, 36, 92, 0.4);
        }
        .sidebar a:hover {
            color: #ffd700;
            background-color: #0d0b21;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 25px;
            border: none;
            background: none;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .page-title {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #28245c;
            padding-bottom: 10px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #171336;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #28245c;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #28245c;
        }
        th {
            background: #201a47;
            color: #ffd700;
        }
        td {
            color: #ccc;
        }
        .status-pending {
            color: #ffa502;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">👑 CHEAPEST SMMPANELS</div>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">&times;</a>
        <a href="dashboard.html">🛒 New Order</a>
        <a href="orders.html" style="color: #ffd700;">📦 Orders</a>
        <a href="services.html">📋 Services</a>
        <a href="add-funds.html">💳 Add Funds</a>
        <a href="mass-order.html">⚡ Mass Order</a>
        <a href="referrals.html">🎁 Refer & Earn</a>
        <a href="updates.html">🔔 Updates</a>
        <a href="account.html">👤 Account</a>
        <a href="#" onclick="logout()" style="color: #ff4757; font-weight: bold;">🚪 Logout</a>
    </div>

    <div class="container">
        <div class="page-title">📦 Order History</div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Link</th>
                        <th>Qty</th>
                        <th>Charge</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center;">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            sidebar.style.width = sidebar.style.width === "250px" ? "0" : "250px";
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDiqGuREonvLCr4I3ly0ChHzpMAbeDnrPA",
          authDomain: "sahidsmmpenal-635b4.firebaseapp.com",
          projectId: "sahidsmmpenal-635b4",
          storageBucket: "sahidsmmpenal-635b4.firebasestorage.app",
          messagingSenderId: "982748676616",
          appId: "1:982748676616:web:a2a83d7f20734b638107bd",
          measurementId: "G-B6EHE18EZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const tbody = document.getElementById("orders-table-body");
                tbody.innerHTML = "";

                try {
                    const q = query(collection(db, "orders"), where("userId", "==", user.uid));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No orders found!</td></tr>`;
                        return;
                    }

                    querySnapshot.forEach((doc) => {
                        const order = doc.data();
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${order.service}</td>
                            <td><a href="${order.link}" target="_blank" style="color: #4cd137; text-decoration: none;">Link</a></td>
                            <td>${order.quantity}</td>
                            <td>₹${order.charge}</td>
                            <td><span class="status-pending">${order.status}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (error) {
                    console.error("Error loading orders: ", error);
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4757;">Failed to load orders.</td></tr>`;
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
